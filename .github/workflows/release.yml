name: Release extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching package.json (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, package, and release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"

          if [[ "${REQUESTED_TAG}" != "${expected_tag}" ]]; then
            echo "Release tag ${REQUESTED_TAG} does not match package.json version ${version}." >&2
            echo "Use ${expected_tag}, or update package.json before releasing." >&2
            exit 1
          fi

          echo "tag=${REQUESTED_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Type-check
        run: npm run compile

      - name: Run unit tests
        run: npm test

      - name: Package Chrome extension
        run: npm run zip

      - name: Package Edge extension
        run: npx --no-install wxt zip -b edge

      - name: Prepare release assets
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp ".output/koharu-manga-companion-${VERSION}-chrome.zip" release/
          cp ".output/koharu-manga-companion-${VERSION}-edge.zip" release/
          cd release
          sha256sum ./*.zip > SHA256SUMS.txt

      - name: Preserve packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: koharu-manga-companion-${{ steps.release.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release/* --clobber
            exit 0
          fi

          prerelease_args=()
          if [[ "${VERSION}" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "${RELEASE_TAG}" release/* \
            --title "Koharu Manga Companion ${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --generate-notes \
            "${prerelease_args[@]}"
